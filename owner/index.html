<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ACE Command Center</title>
<meta name="description" content="Owner-only command center: alerts, tasks, approvals and project updates.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ACE Command">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/owner/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#000;--raise:#0F0F11;--raise2:#16171A;--edge:#26282D;--edge2:#34373D;--red:#e3242b;--silver:#C9CDD2;--steel:#949AA2;--white:#fff;--amber:#E8A33D;--green:#3FB97A}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{background:var(--ink);-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ink);color:var(--silver);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{width:min(100% - 2rem,40rem);margin-inline:auto}
  h1,h2{font-family:'Archivo',sans-serif;color:var(--white);letter-spacing:-.02em;margin:0}
  header{padding:calc(.8rem + env(safe-area-inset-top)) 0 .4rem;display:flex;align-items:center;gap:.7rem}
  header img{width:44px;height:44px;mix-blend-mode:lighten}
  h1{font-size:1.5rem}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
  .card{background:var(--raise);border:1px solid var(--edge);border-radius:14px;padding:1.05rem 1rem 1.15rem;margin:0 0 .9rem}
  label{display:block;font-weight:600;color:#E6E8EB;font-size:.95rem;margin:0 0 .35rem}
  input,textarea{width:100%;background:var(--raise2);border:1px solid var(--edge2);color:#fff;border-radius:10px;padding:.8rem .9rem;font:inherit;font-size:16px}
  textarea{min-height:4.5rem;resize:vertical;margin-top:.6rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-family:'Archivo',sans-serif;font-weight:800;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;min-height:3rem;padding:.6rem 1rem;border:1px solid transparent;cursor:pointer;flex:1}
  .btn-approve{background:var(--green);color:#04140b}
  .btn-change{background:transparent;color:var(--amber);border-color:var(--amber)}
  .btn-reject{background:transparent;color:#ff6b70;border-color:#5a2326}
  .btn-primary{background:var(--red);color:#fff}
  .btn-ghost{background:transparent;color:var(--silver);border-color:var(--edge2)}
  .row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
  .status{min-height:1.3em;font-size:.92rem;color:#E6E8EB;margin:.6rem 0 0}
  .tabs{display:flex;gap:.4rem;margin:.4rem 0 .9rem;overflow-x:auto}
  .tabs button{background:var(--raise2);color:var(--silver);border:1px solid var(--edge2);border-radius:999px;padding:.45rem .85rem;font:inherit;font-size:.88rem;white-space:nowrap;cursor:pointer}
  .tabs button[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
  .meta{display:flex;flex-wrap:wrap;gap:.35rem .8rem;margin:0 0 .45rem}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
  .pill.urgent{color:var(--red)}
  .d-title{color:#fff;font-weight:600;font-size:1.05rem;margin:0 0 .4rem}
  .d-body{white-space:pre-wrap;font-size:.95rem;color:#E6E8EB;margin:0;max-height:16rem;overflow:auto;background:var(--raise2);border-radius:10px;padding:.7rem .8rem}
  .d-media img,.d-media video{width:100%;border-radius:10px;margin-top:.6rem;background:#111}
  .done{font-size:.9rem;margin:.6rem 0 0}
  .btn-approve.alt{background:transparent;color:var(--green);border-color:var(--green)}
  .when{display:block;margin:.7rem 0 0;font-weight:500;font-size:.9rem;color:var(--steel)}
  .when input{margin-top:.35rem;color-scheme:dark}
  .hint{font-size:.88rem;color:var(--amber);margin:.6rem 0 0}
  .d-media video{max-height:70vh}
  .done.APPROVED{color:var(--green)} .done.CHANGE_REQUESTED{color:var(--amber)} .done.REJECTED{color:#ff6b70}
  .empty{color:var(--steel)}
  .push{border-left:3px solid var(--red)}
  .proj{display:flex;gap:.4rem;margin:.2rem 0 1rem;overflow-x:auto;padding-bottom:.3rem;scrollbar-width:thin}
  .proj button{position:relative;background:var(--raise);color:var(--silver);border:1px solid var(--edge2);border-radius:10px;padding:.55rem .8rem;font:inherit;font-size:.9rem;font-weight:600;white-space:nowrap;cursor:pointer;min-height:2.75rem}
  .proj button[aria-current=true]{background:var(--red);color:#fff;border-color:var(--red)}
  .proj button[data-p=alerts]{border-color:#5a2326}
  .proj .b{display:inline-block;min-width:1.4em;margin-left:.35rem;padding:0 .35rem;border-radius:999px;background:#fff;color:#000;font-size:.75rem;font-weight:700;text-align:center}
  .proj .b:empty{display:none}
  .proj button[data-p=alerts] .b{background:var(--red);color:#fff}
  .cmd-h{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin:0 0 .7rem}
  .cmd-h h2{font-size:1.15rem}
  .item{border-left:3px solid var(--edge2)}
  .item.P0{border-left-color:var(--red)} .item.P1{border-left-color:var(--amber)} .item.task{border-left-color:var(--green)}
  .item.closed{opacity:.6}
  .item .row .btn{min-height:2.6rem;font-size:.8rem}
  .sec{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin:1.1rem 0 .5rem}
  .ck{display:grid;grid-template-columns:3.2rem 1fr auto;gap:.2rem .6rem;align-items:start;padding:.55rem 0;border-top:1px solid var(--edge)}
  .ck:first-child{border-top:0}
  .ck b{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--steel);font-weight:500}
  .ck .s{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .ck .s.VERIFIED,.ck .s.DONE_NO_VERIFY_NEEDED{color:var(--green)} .ck .s.AWAITING_VERIFY{color:var(--amber)} .ck .s.OPEN{color:var(--silver)} .ck .s.BLOCKED{color:#ff6b70}
  .ck small{grid-column:2/4;color:var(--steel);font-size:.82rem}
  .item a{color:#fff}
  .item [data-st]:empty{min-height:0;margin:0}
  @media (min-width:700px){.proj{flex-wrap:wrap;overflow:visible}}
  .vault-bar{display:flex;gap:.5rem;align-items:center;margin:0 0 .4rem}
  .vault-bar select{flex:1;min-width:0;background:var(--raise2);border:1px solid var(--edge2);color:#fff;border-radius:10px;padding:.7rem .8rem;font:inherit;font-size:16px}
  .v-up{flex:0 0 auto;min-height:2.9rem}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
  .vtile{margin:0;background:var(--raise);border:1px solid var(--edge);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .vtile img,.vtile video{width:100%;aspect-ratio:1/1;object-fit:cover;background:#0a0a0a;display:block}
  .vpdf{aspect-ratio:1/1;display:grid;place-items:center;color:var(--steel);font-family:'IBM Plex Mono',monospace}
  .vtile figcaption{padding:.55rem .6rem .65rem;display:flex;flex-direction:column;gap:.2rem;font-size:.82rem}
  .vtile figcaption b{color:#fff;font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
  .vtile figcaption span{color:var(--steel)}
  .vacts{display:flex;flex-wrap:wrap;gap:.35rem .7rem;margin-top:.2rem}
  .vacts a,.vacts button{color:var(--silver);background:none;border:0;padding:0;font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer}
  .vtile.posting{grid-column:1/-1}.vtile.posting img,.vtile.posting video{max-height:260px;object-fit:contain}
  .vpost{padding:.7rem .75rem .8rem;border-top:1px solid rgba(255,255,255,.08)}
  .vpost label{display:block;font-size:.85rem;margin:.3rem 0}
  .vpost textarea{width:100%;box-sizing:border-box;margin-top:.3rem;font:inherit;font-size:.9rem;padding:.5rem;border-radius:8px;background:rgba(0,0,0,.3);color:inherit;border:1px solid rgba(255,255,255,.15)}
  .vch{display:flex;flex-wrap:wrap;gap:.2rem .9rem}.vch label{display:inline-flex;white-space:nowrap;gap:.3rem;align-items:center}
  .vpost .row{flex-wrap:wrap}
  footer{padding:1.5rem 0 calc(2rem + env(safe-area-inset-bottom));text-align:center;font-size:.8rem;color:var(--steel)}
</style>
</head>
<!-- Owner-only page. Not a public offer page and not linked from the site.
     Every read and every decision goes through Supabase RPCs that check the
     signed-in email against ace_v2.owner_accounts; anyone else sees nothing. -->
<body data-page-key="owner" data-release-state="OWNER_ONLY">
<header class="wrap">
  <img src="/assets/ace-logo.jpg" alt="" width="44" height="44">
  <div><h1>Command Center</h1><span class="tag">Owner only</span></div>
</header>
<main class="wrap" id="main">
  <section class="card" id="signin" hidden>
    <h2 style="font-size:1.1rem;margin-bottom:.6rem">Owner sign-in</h2>
    <form id="email-form" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" required>
      <div class="row"><button class="btn btn-primary" type="submit">Send my code</button></div>
    </form>
    <form id="code-form" hidden novalidate>
      <label for="code" style="margin-top:1rem">6-digit code</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>
      <div class="row"><button class="btn btn-primary" type="submit">Sign in</button></div>
    </form>
    <p class="status" id="signin-status" role="status" aria-live="polite"></p>
  </section>

  <section class="card" id="notowner" hidden>
    <h2 style="font-size:1.1rem">Not an owner account</h2>
    <p><b id="no-email"></b> cannot open the Command Center. Customers use <a href="/my-ace/">My ACE</a>.</p>
    <div class="row"><button class="btn btn-ghost" type="button" data-signout>Sign out</button></div>
  </section>

  <div id="dash" hidden>
    <section class="card push" id="push-card" hidden>
      <p style="margin:0" id="push-text">Turn on alerts so your phone buzzes when drafts are waiting.</p>
      <div class="row"><button class="btn btn-primary" type="button" id="push-btn">Turn on phone alerts</button></div>
      <p class="status" id="push-status" role="status"></p>
    </section>
    <nav class="proj" id="proj" aria-label="Projects"></nav>
    <section id="panel-cmd" hidden aria-live="polite">
      <div class="cmd-h"><h2 id="cmd-title">Alerts</h2><button class="btn btn-ghost" type="button" id="cmd-showall" style="flex:0 0 auto;min-height:2.4rem;font-size:.75rem">Show done</button></div>
      <div id="cmd-list"></div>
    </section>
    <section id="panel-approvals">

    <div class="tabs" role="group" aria-label="Filter drafts">
      <button type="button" data-tab="PENDING" aria-pressed="true">Waiting <span id="n-pending">0</span></button>
      <button type="button" data-tab="APPROVED" aria-pressed="false">Approved <span id="n-approved">0</span></button>
      <button type="button" data-tab="CHANGE_REQUESTED" aria-pressed="false">Changes <span id="n-change">0</span></button>
      <button type="button" data-tab="REJECTED" aria-pressed="false">Rejected <span id="n-rejected">0</span></button>
    </div>
    <div id="list"></div>
    </section>
    <div class="row" style="justify-content:center"><button class="btn btn-ghost" type="button" data-signout style="flex:0 1 12rem">Sign out</button></div>
  </div>
  <noscript><p>Turn on JavaScript to use the Command Center.</p></noscript>
</main>
<footer class="wrap">ACE Growth Operating Systems · Signed-in decisions are recorded under your account</footer>
<script src="../assets/my-ace-config.js" defer></script>
<script src="../assets/owner-config.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<script src="../assets/owner.js" defer></script>
<script src="../assets/marketing-vault.js" defer></script>
<script src="../assets/command-center.js" defer></script>
</body>
</html>
